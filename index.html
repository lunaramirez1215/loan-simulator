<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulador de Préstamos Bancarios</title>
</head>
<body>

    <h2>Simulador de Préstamos Bancarios</h2>

    <form id="loanForm">
        <label for="loanAmount">Monto total del préstamo:</label>
        <input type="number" id="loanAmount" min="0.01" step="0.01" required>

        <br><br>

        <label for="interestRate">Tasa de interés (%):</label>
        <input type="number" id="interestRate" min="0" step="0.0001" required>

        <br><br>

        <label for="interestType">Tipo de tasa de interés:</label>
        <select id="interestType" required>
            <option value="annual">Efectiva anual (EA)</option>
            <option value="monthly">Efectiva mensual (EM)</option>
        </select>

        <br><br>

        <label for="loanTerm">Plazo del préstamo (meses):</label>
        <input type="number" id="loanTerm" min="1" step="1" required>

        <br><br>

        <button type="submit">Calcular préstamo</button>
        <button type="reset">Limpiar</button>
    </form>

    <h3>Resultados de la simulación</h3>

    <div id="results" aria-live="polite">
        <p>Ingrese los datos y presione "Calcular préstamo".</p>
    </div>

    <script>
        const loanForm = document.getElementById("loanForm");
        const results = document.getElementById("results");

        loanForm.addEventListener("submit", function(event) {
            event.preventDefault();

            // Obtener valores ingresados
            const loanAmount = Number(document.getElementById("loanAmount").value);
            const interestRate = Number(document.getElementById("interestRate").value);
            const interestType = document.getElementById("interestType").value;
            const loanTerm = Number(document.getElementById("loanTerm").value);

            // Validar datos
            if (
                !Number.isFinite(loanAmount) ||
                !Number.isFinite(interestRate) ||
                !Number.isInteger(loanTerm) ||
                loanAmount <= 0 ||
                interestRate < 0 ||
                loanTerm <= 0
            ) {
                results.innerHTML = "<p>Error: Verifique que todos los valores sean válidos.</p>";
                return;
            }

            // Convertir la tasa de interés a tasa efectiva mensual
            let monthlyRate;

            if (interestType === "annual") {
                const annualRate = interestRate / 100;
                monthlyRate = Math.pow(1 + annualRate, 1 / 12) - 1;
            } else {
                monthlyRate = interestRate / 100;
            }

            // Calcular cuota mensual utilizando el sistema de amortización francés
            let monthlyPayment;

            if (monthlyRate === 0) {
                monthlyPayment = loanAmount / loanTerm;
            } else {
                monthlyPayment =
                    loanAmount *
                    (monthlyRate * Math.pow(1 + monthlyRate, loanTerm)) /
                    (Math.pow(1 + monthlyRate, loanTerm) - 1);
            }

            // Calcular valores totales
            const totalPayment = monthlyPayment * loanTerm;
            const totalInterest = totalPayment - loanAmount;

            // Formatear moneda
            const formatter = new Intl.NumberFormat("es-CO", {
                style: "currency",
                currency: "COP",
                minimumFractionDigits: 2,
                maximumFractionDigits: 2
            });

            // Mostrar resultados
            results.innerHTML = `
                <p><strong>Monto del préstamo:</strong> ${formatter.format(loanAmount)}</p>
                <p><strong>Tasa efectiva mensual:</strong> ${(monthlyRate * 100).toFixed(6)}%</p>
                <p><strong>Plazo:</strong> ${loanTerm} meses</p>
                <p><strong>Cuota mensual:</strong> ${formatter.format(monthlyPayment)}</p>
                <p><strong>Total de intereses:</strong> ${formatter.format(totalInterest)}</p>
                <p><strong>Total a pagar:</strong> ${formatter.format(totalPayment)}</p>
            `;

            // Generar tabla de amortización
            let balance = loanAmount;
            let tableHTML = `
                <h4>Tabla de amortización</h4>
                <table border="1" cellpadding="5">
                    <thead>
                        <tr>
                            <th>Período</th>
                            <th>Cuota</th>
                            <th>Interés</th>
                            <th>Abono a capital</th>
                            <th>Saldo pendiente</th>
                        </tr>
                    </thead>
                    <tbody>
            `;

            for (let month = 1; month <= loanTerm; month++) {
                const interestPayment = balance * monthlyRate;
                let capitalPayment = monthlyPayment - interestPayment;
                let payment = monthlyPayment;

                if (month === loanTerm) {
                    capitalPayment = balance;
                    payment = capitalPayment + interestPayment;
                }

                balance = Math.max(0, balance - capitalPayment);

                tableHTML += `
                    <tr>
                        <td>${month}</td>
                        <td>${formatter.format(payment)}</td>
                        <td>${formatter.format(interestPayment)}</td>
                        <td>${formatter.format(capitalPayment)}</td>
                        <td>${formatter.format(balance)}</td>
                    </tr>
                `;
            }

            tableHTML += `
                    </tbody>
                </table>
            `;

            results.innerHTML += tableHTML;
        });

        // Limpiar resultados al reiniciar el formulario
        loanForm.addEventListener("reset", function() {
            results.innerHTML = "<p>Ingrese los datos y presione 'Calcular préstamo'.</p>";
        });
    </script>

</body>
</html>
